version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Mount backend directory - this should sync files between host and container
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/backend/connector.db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend